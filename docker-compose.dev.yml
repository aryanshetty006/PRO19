version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: f1-mongodb-dev
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: f1_website
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data_dev:/data/db
      - ./backend/scripts/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - f1-network-dev

  # Backend API (Development)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: f1-backend-dev
    restart: unless-stopped
    env_file:
      - env.example
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/f1_website?authSource=admin
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    networks:
      - f1-network-dev
    volumes:
      - ./backend:/app
    command: npm run dev

  # Frontend React App (Development)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: f1-frontend-dev
    restart: unless-stopped
    env_file:
      - env.example
    environment:
      REACT_APP_API_URL: http://localhost:5000
      CHOKIDAR_USEPOLLING: true
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - f1-network-dev
    volumes:
      - ./frontend:/app
    command: npm start

volumes:
  mongodb_data_dev:
    driver: local

networks:
  f1-network-dev:
    driver: bridge
